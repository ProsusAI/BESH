events {
    worker_connections 32000;
}

http {
    # Map Upgrade header to a proper Connection header (only upgrade when present)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      keep-alive;
    }

    # Allow large requests (big prompts/files)
    client_max_body_size 0;
    client_body_timeout 3600s;
    client_header_timeout 3600s;
    send_timeout 3600s;
    keepalive_timeout 75s;

    # Define upstream group with all 8 vLLM instances
    upstream vllm_backend {
        # Share state across workers for fair least_conn load balancing
        zone vllm_backend 64k;
        # Use least_conn for better load distribution
        least_conn;
        # Keep persistent connections to backends
        keepalive 64;
        # Local 8 GPUs
        server vllm-gpu-0:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-1:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-2:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-3:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-4:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-5:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-6:8000 max_fails=3 fail_timeout=30s;
        server vllm-gpu-7:8000 max_fails=3 fail_timeout=30s;

        # Remote cluster A (8 GPUs) - maps to host ports 9001-9008
        server remote-vllm-gpu-0:9001 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-1:9002 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-2:9003 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-3:9004 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-4:9005 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-5:9006 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-6:9007 max_fails=3 fail_timeout=30s;
        server remote-vllm-gpu-7:9008 max_fails=3 fail_timeout=30s;

        # Remote cluster B (8 GPUs) - maps to host ports 9001-9008
        server remote2-vllm-gpu-0:9001 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-1:9002 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-2:9003 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-3:9004 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-4:9005 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-5:9006 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-6:9007 max_fails=3 fail_timeout=30s;
        server remote2-vllm-gpu-7:9008 max_fails=3 fail_timeout=30s;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 8000;
        server_name localhost;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx_status {
            access_log off;
            return 200 "nginx load balancer active (24 backends)\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://vllm_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # Increase the time Nginx will wait for a response from vLLM
            proxy_read_timeout 3600s; 
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}


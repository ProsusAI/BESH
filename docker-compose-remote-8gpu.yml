#version: '3.8'

services:
  # LMCache server for this remote cluster (distributed KV cache sharing)
  lmcache-server:
    image: lmcache/lmcache-server:latest
    container_name: lmcache-server
    command: [
      "--host", "0.0.0.0",
      "--port", "6000",
      "--chunk-size", "256",
      "--cpu-buffer-size", "50.0",
      "--max-workers", "8"
    ]
    expose:
      - "6000"
    networks:
      - vllm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\", 6000)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  vllm-gpu-0:
    image: vllm/vllm-openai:latest
    container_name: vllm-server-gpu-0
    platform: linux/amd64
    ports:
      - "9001:8000"
    volumes:
      - ${MODEL_PATH}:/models
      - vllm_models:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
    command: [
      "--model", "/models",
      "--served-model-name", "${SERVED_MODEL_NAME}",
      "--host", "0.0.0.0",
      "--port", "8000",
      "--tensor-parallel-size", "1",
      "--max-model-len", "32000",
      "--api-key", "${VLLM_API_KEY}",
      "--quantization", "fp8",
      "--kv-cache-dtype", "fp8",
      "--gpu-memory-utilization", "0.94",
      "--enable-chunked-prefill",
      "--async-scheduling",
      "--uvicorn-log-level", "warning",
      "--max-num-batched-tokens", "49152",
      "--max-num-seqs", "384",
      "--kv-transfer-config", "{\"kv_connector\":\"LMCacheMPConnector\", \"kv_role\":\"kv_both\", \"kv_connector_extra_config\": {\"lmcache.mp.host\": \"lmcache-server\", \"lmcache.mp.port\": 6000}}"
    ]
    depends_on:
      - lmcache-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - vllm-network


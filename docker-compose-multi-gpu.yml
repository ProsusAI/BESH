#version: '3.8'

# Extension fields for reusable configuration
x-vllm-common: &vllm-common
  image: vllm/vllm-openai:latest
  ipc: host
  platform: linux/amd64
  expose:
    - "8000"
  volumes:
    - ${MODEL_PATH}:/models
    - vllm_models:/root/.cache/huggingface
  environment:
    - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
  command: [
    "--model", "/models",
    "--served-model-name", "${SERVED_MODEL_NAME}",
    "--host", "0.0.0.0",
    "--port", "8000",
    "--tensor-parallel-size", "1",
    "--max-model-len", "32000",
    "--api-key", "${VLLM_API_KEY}",
    #"--quantization", "fp8",
    #"--kv-cache-dtype", "fp8",
    #"--gpu-memory-utilization", "0.75",
    #"--enable-prefix-caching",
    #"--enable-chunked-prefill",
    #"--async-scheduling",
    #"--uvicorn-log-level", "warning",
   # "--max-num-batched-tokens", "49152",
   # "--max-num-seqs", "384",
    "--override-generation-config", "{\"temperature\": 0.0, \"max_tokens\": 6000}",
  ]
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 60s
  restart: unless-stopped
  networks:
    - batch-network

services:

  # Postgres database (shared)
  postgres:
    image: postgres:16
    container_name: postgres
    command: postgres -c max_connections=1000
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-batch}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-batch}
      - POSTGRES_DB=${POSTGRES_DB:-batch}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-batch} -d ${POSTGRES_DB:-batch}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - batch-network

  # Redis for caching and queuing
  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Load balancer for distributing requests across vLLM instances
  nginx-lb:
    image: nginx:alpine
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    container_name: nginx-load-balancer
    ports:
      - "8000:8000"
    volumes:
      - ./${NGINX_CONF:-nginx-24gpu.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - vllm-gpu-0
      - vllm-gpu-1
      - vllm-gpu-2
      - vllm-gpu-3
      - vllm-gpu-4
      - vllm-gpu-5
      - vllm-gpu-6
      - vllm-gpu-7
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - batch-network
    extra_hosts:
      # Remote cluster A (map to REMOTE_CLUSTER_HOST_A)
      - "remote-vllm-gpu-0:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-1:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-2:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-3:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-4:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-5:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-6:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      - "remote-vllm-gpu-7:${REMOTE_CLUSTER_HOST_A:-127.0.0.1}"
      # Remote cluster B (map to REMOTE_CLUSTER_HOST_B)
      - "remote2-vllm-gpu-0:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-1:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-2:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-3:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-4:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-5:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-6:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      - "remote2-vllm-gpu-7:${REMOTE_CLUSTER_HOST_B:-127.0.0.1}"
      # Remote cluster C (map to REMOTE_CLUSTER_HOST_C)
      - "remote3-vllm-gpu-0:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-1:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-2:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-3:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-4:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-5:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-6:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"
      - "remote3-vllm-gpu-7:${REMOTE_CLUSTER_HOST_C:-127.0.0.1}"

  vllm-gpu-0:
    <<: *vllm-common
    container_name: vllm-server-gpu-0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]

  vllm-gpu-1:
    <<: *vllm-common
    container_name: vllm-server-gpu-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]

  vllm-gpu-2:
    <<: *vllm-common
    container_name: vllm-server-gpu-2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['2']
              capabilities: [gpu]

  vllm-gpu-3:
    <<: *vllm-common
    container_name: vllm-server-gpu-3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['3']
              capabilities: [gpu]

  vllm-gpu-4:
    <<: *vllm-common
    container_name: vllm-server-gpu-4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['4']
              capabilities: [gpu]

  vllm-gpu-5:
    <<: *vllm-common
    container_name: vllm-server-gpu-5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['5']
              capabilities: [gpu]

  vllm-gpu-6:
    <<: *vllm-common
    container_name: vllm-server-gpu-6
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['6']
              capabilities: [gpu]

  vllm-gpu-7:
    <<: *vllm-common
    container_name: vllm-server-gpu-7
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['7']
              capabilities: [gpu]

  fast-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fast-api
    ports:
      - "8080:8080"
    volumes:
      #- /home/kinga/BatchEndpoint:/app
      - /home/kinga/BESH:/app
      - batch_files:/tmp/batch_files
      - ./logs:/app/logs
    environment:
      - OPENAI_API_BASE=http://nginx-lb:8000/v1
      - OPENAI_API_KEY=${VLLM_API_KEY}
      - UPLOAD_FOLDER=/tmp/batch_files
      - PYTHONPATH=/app
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-batch}:${POSTGRES_PASSWORD:-batch}@postgres:5432/${POSTGRES_DB:-batch}
      - REDIS_URL=redis://redis:6379
      - DB_POOL_SIZE=20
      - DB_MAX_OVERFLOW=200
    depends_on:
      postgres:
        condition: service_healthy
      nginx-lb:
        condition: service_healthy
      redis:
        condition: service_healthy
      # worker dependency removed to support scaling (--scale worker=4)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - batch-network

  # Worker service for processing batch jobs (scalable with --scale worker=4)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      - PYTHONPATH=/app
      - UPLOAD_FOLDER=/tmp/batch_files
      - OPENAI_API_BASE=http://nginx-lb:8000/v1
      - OPENAI_API_KEY=${VLLM_API_KEY}
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://${POSTGRES_USER:-batch}:${POSTGRES_PASSWORD:-batch}@postgres:5432/${POSTGRES_DB:-batch}
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=${MAX_WORKERS:-64}
      - WORKER_COUNT=${WORKER_COUNT:-8}
      - LITELLM_MAX_CONNECTIONS=${LITELLM_MAX_CONNECTIONS:-256}
      - LITELLM_MAX_KEEPALIVE_CONNECTIONS=${LITELLM_MAX_KEEPALIVE_CONNECTIONS:-256}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=50
      - WORKER_CONCURRENCY=16
      - BATCH_SIZE=32
    volumes:
      - batch_files:/tmp/batch_files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - batch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import redis; r=redis.Redis(host=\"redis\", port=6379); r.ping()'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Remove container_name to allow scaling
    # Use: docker-compose up --scale worker=4
 
networks:
  batch-network:
    driver: bridge

volumes:

  postgres_data:
    driver: local
  batch_files:
    driver: local
  vllm_models:
    driver: local
  redis_data:
    driver: local